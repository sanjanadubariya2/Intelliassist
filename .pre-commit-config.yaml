# Runs the same gates as CI, so a failure shows up before the push rather than
# after it. Hooks are `local` and shell out to uv, so there is exactly one
# source of truth for tool versions — the lockfile — instead of a second set
# pinned here that can drift from it.

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy (strict)
        # Passing changed files alone would miss errors in their dependents, so
        # the whole package is checked. It takes a couple of seconds.
        entry: uv run mypy app
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
