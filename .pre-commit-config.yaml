# Runs the same gates as CI, so a failure shows up before the push rather than
# after it. Hooks are `local` and shell out to uv, so there is exactly one
# source of truth for tool versions — the lockfile — instead of a second set
# pinned here that can drift from it.
#
# Each hook cds into ai-service rather than using `uv run --project`: the
# flag selects the environment but leaves the working directory at the repo
# root, so ruff and mypy never read ai-service/pyproject.toml and mypy fails
# on the import overrides that file exists to declare.

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: bash -c 'cd ai-service && uv run ruff check --fix app tests'
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: ruff-format
        name: ruff (format)
        entry: bash -c 'cd ai-service && uv run ruff format app tests'
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: mypy
        name: mypy (strict)
        # Passing changed files alone would miss errors in their dependents, so
        # the whole package is checked. It takes a couple of seconds.
        entry: bash -c 'cd ai-service && uv run mypy app'
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

  # The same three pre-commit-hooks checks, run as `python -m` modules rather
  # than through the console-script .exe files pip generates. Windows Smart
  # App Control blocks some of those unsigned .exe files by reputation, while
  # the venv's python.exe is allowed, so this form runs everywhere.
  - repo: local
    hooks:
      - id: end-of-file-fixer
        name: fix end of files
        entry: python -m pre_commit_hooks.end_of_file_fixer
        language: python
        additional_dependencies: [pre-commit-hooks==5.0.0]
        types: [text]

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: python -m pre_commit_hooks.trailing_whitespace_fixer
        language: python
        additional_dependencies: [pre-commit-hooks==5.0.0]
        types: [text]

      - id: check-merge-conflict
        name: check for merge conflicts
        entry: python -m pre_commit_hooks.check_merge_conflict
        language: python
        additional_dependencies: [pre-commit-hooks==5.0.0]
        types: [text]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
