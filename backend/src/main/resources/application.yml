# Base configuration. Every environment-specific value comes from an
# environment variable with a local-friendly default, so a developer can run
# the service with no setup while a deployment supplies real values.
spring:
  application:
    name: intelliassist-backend

  datasource:
    # Its own database, separate from the AI service's. They share a Postgres
    # server locally for convenience, but never a schema: the AI service owns
    # chunks and embeddings, this one owns tenants and conversations, and
    # neither reads the other's tables.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/intelliassist_backend}
    username: ${DB_USERNAME:intelliassist}
    password: ${DB_PASSWORD:intelliassist}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000
      pool-name: intelliassist-pool

  jpa:
    # Flyway owns the schema; Hibernate only checks that its mapping agrees with
    # it. Anything other than `validate` lets the two drift apart silently, and
    # `update` in particular can rewrite a production schema on startup.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      # Matches the AI service's own 50 MB ceiling. A larger limit here would
      # only let an upload travel the whole way before being rejected.
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:52MB}

server:
  port: ${SERVER_PORT:8080}
  error:
    # Never leak stack traces or internal messages to a client.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Deliberately minimal. Every exposed endpoint is attack surface, and
        # `env` or `configprops` would print configuration including secrets.
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        # Readiness names only the dependencies whose loss means this instance
        # genuinely cannot serve. The AI service is not one of them: if it is
        # down, chat fails but login, bot management and document listing all
        # still work, and pulling the instance from rotation would take the
        # whole dashboard down with generation.
        readiness:
          include: db
        liveness:
          include: livenessState
  info:
    env:
      enabled: false

# Settings owned by this application rather than by Spring.
intelliassist:
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    # No default: the application must fail to start rather than run unguarded.
    api-key: ${AI_SERVICE_API_KEY:}
    connect-timeout: ${AI_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_SERVICE_READ_TIMEOUT:10s}
    # Generation is slow by nature; the AI service's own LLM timeout is 60s.
    query-timeout: ${AI_SERVICE_QUERY_TIMEOUT:70s}
    # Streaming bounds latency, not length. The first event waits on retrieval
    # and reranking; after that, tokens arrive continuously, so a 30s silence
    # means something is wrong rather than that the answer is long.
    stream-first-event-timeout: ${AI_SERVICE_STREAM_FIRST_EVENT_TIMEOUT:75s}
    stream-idle-timeout: ${AI_SERVICE_STREAM_IDLE_TIMEOUT:30s}
    # Recent messages sent with a question so the AI service can rewrite a
    # follow-up into a standalone search query. Set 0 to send none, which
    # restores the pre-rewriting behaviour from this side.
    history-turns: ${AI_SERVICE_HISTORY_TURNS:6}
  jwt:
    # No default: a deployment must supply a real key or fail to start.
    # Generate one with: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:12h}
    issuer: intelliassist
  cors:
    # Origin patterns. Locally any port, because Next.js moves to 3001+ when
    # 3000 is busy. In production set CORS_ALLOWED_ORIGINS to the exact origin.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
  # Single sign-on. A provider is offered only when both its client id and
  # secret are set; leave them empty to turn it off. Register this callback
  # with each provider:  <OAUTH_PUBLIC_URL>/api/v1/auth/oauth/<provider>/callback
  oauth:
    frontend-url: ${OAUTH_FRONTEND_URL:http://localhost:3000}
    public-url: ${OAUTH_PUBLIC_URL:http://localhost:8080}
    providers:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
      github:
        client-id: ${GITHUB_CLIENT_ID:}
        client-secret: ${GITHUB_CLIENT_SECRET:}
      linkedin:
        client-id: ${LINKEDIN_CLIENT_ID:}
        client-secret: ${LINKEDIN_CLIENT_SECRET:}

# API documentation. Enabled by default for development and disabled in
# production by application-prod.yml: publishing a complete catalogue of every
# endpoint, DTO and validation rule helps an attacker more than it helps anyone
# else once the API is stable.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.intelliassist.backend: ${LOG_LEVEL:INFO}
